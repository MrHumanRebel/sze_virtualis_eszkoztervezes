[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sze-virtualis-eszkoztervezes"
version = "0.1.0"
description = "GKLM_AUTM029 Plant Simulation 2D assignment builder"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
windows = ["pywin32>=306", "reportlab>=4.0,<5"]
dev = ["pytest>=8"]

[project.scripts]
sze-plant-build = "sze_virtualis_eszkoztervezes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
