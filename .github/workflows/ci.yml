name: Offline validation
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python 3.12 / spec verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m pytest -q
      - name: Plan smoke test
        run: python -m sze_virtualis_eszkoztervezes --plan > model-plan.json
      - name: Archive offline plan
        uses: actions/upload-artifact@v4
        with:
          name: offline-model-plan
          path: model-plan.json
